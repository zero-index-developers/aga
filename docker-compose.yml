name: aga-dev

services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: aga-database-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-aga_db}
      POSTGRES_USER: ${DB_USERNAME:-aga_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aga_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - aga-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aga_user} -d ${DB_DATABASE:-aga_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel API Backend (Development)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: aga-api-dev
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_NAME: ${APP_NAME:-AGA}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-aga_db}
      DB_USERNAME: ${DB_USERNAME:-aga_user}
      DB_PASSWORD: ${DB_PASSWORD:-aga_password}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    volumes:
      - ./api:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - aga-network-dev
    command: >
      sh -c "composer install --no-interaction &&
             php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  # Next.js Frontend Client (Development)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aga-client-dev
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: true
      CHOKIDAR_USEPOLLING: true
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - aga-network-dev
    command: npm run dev

networks:
  aga-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local

